name: Release (fork)

run-name: "Tinycast ${{ inputs.version || github.ref_name }} · fork #${{ github.run_number }}"

on:
  push:
    tags:
      - "v*-fork.*"
  workflow_dispatch:
    inputs:
      version:
        description: The fork version to publish again, e.g. 0.11.21-beta.120-fork.1; its tag v<version> must exist
        required: true
        type: string

concurrency:
  group: release-fork-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: namespace-profile-mac;overrides.cache-tag=tinycast-xcode
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Resolve the version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          case "$VERSION" in
            *-fork.*) ;;
            *) echo "::error::$VERSION is not a fork version"; exit 1 ;;
          esac
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "upstream=${VERSION%-fork.*}"
            echo "fork_build=${VERSION##*-fork.}"
            echo "dmg_file=Tinycast-${VERSION}.dmg"
            echo "zip_file=Tinycast-${VERSION}.zip"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}
          fetch-depth: 0

      - name: Verify the tag names its upstream base
        env:
          UPSTREAM: ${{ steps.meta.outputs.upstream }}
        run: |
          git fetch --quiet https://github.com/abue-ammar/tinycast.git 'refs/tags/v*:refs/tags/v*'
          BASE="$(git -c versionsort.suffix=- tag --merged HEAD --list 'v[0-9]*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' | head -n1)"
          if [ "$BASE" != "v$UPSTREAM" ]; then
            echo "::error::the newest upstream tag reachable from this commit is '$BASE', not v$UPSTREAM"
            exit 1
          fi

      - uses: ./.github/actions/build-app
        with:
          version: ${{ steps.meta.outputs.version }}
          build-number: ${{ github.run_number }}
          signing-p12-base64: ${{ secrets.SIGNING_P12_BASE64 }}
          signing-p12-password: ${{ secrets.SIGNING_P12_PASSWORD }}

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          UPSTREAM: ${{ steps.meta.outputs.upstream }}
          FORK_BUILD: ${{ steps.meta.outputs.fork_build }}
        run: |
          PREVIOUS="$(git tag --merged HEAD --list 'v*-fork.*' --sort=-creatordate | grep -vx "$TAG" | head -n1 || true)"
          ARGS=(-f "tag_name=$TAG")
          if [ -n "$PREVIOUS" ]; then
            ARGS+=(-f "previous_tag_name=$PREVIOUS")
          fi
          {
            echo "Fork build ${FORK_BUILD} of Tinycast ${UPSTREAM}. See FORK.md for what this fork carries."
            echo
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${ARGS[@]}" --jq .body
          } > "$RUNNER_TEMP/notes.md"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          UPSTREAM: ${{ steps.meta.outputs.upstream }}
          FORK_BUILD: ${{ steps.meta.outputs.fork_build }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
          ZIP_FILE: ${{ steps.meta.outputs.zip_file }}
        run: |
          TITLE="Tinycast ${UPSTREAM} (fork build ${FORK_BUILD})"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/${DMG_FILE}" "dist/${ZIP_FILE}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --latest
          else
            gh release create "$TAG" "dist/${DMG_FILE}" "dist/${ZIP_FILE}" \
              --verify-tag \
              --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest
          fi
